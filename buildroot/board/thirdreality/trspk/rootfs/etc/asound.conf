pcm.hw01 {
    type hw
    card 0
    device 1
}

pcm.hw02 {
    type hw
    card 0
    device 2
}

# Stable production microphone path. The ALSA PulseAudio plugin forwards this
# stream to the direct PDM source owned by PulseAudio, avoiding the unstable
# four-channel Amlogic loopback DAI.
pcm.cortana_capture {
    type pulse
    device "alsa_input.hw_0_2"
}

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "hw:0,1"
    }
    capture.pcm {
        type plug
        slave.pcm "hw:0,2"
    }
}

ctl.!default {
    type hw
    card 0
}
